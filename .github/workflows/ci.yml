name: CI

# Linux: build, lint, unit + Docker SSH integration tests, editor start-up test.
# No secrets are used; the token is read-only.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Build SSH server images
        run: npm run test:images

      - name: Test
        run: npm test

      - name: Start-up test (VSCodium and VS Code)
        run: xvfb-run -a npm run test:startup

      - name: Package
        run: npx vsce package --no-dependencies -o kasugai.vsix
